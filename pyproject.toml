[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pancontext"
version = "0.1.0"
description = "Audit genomic model predictions across human haplotype contexts."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Ilgaz Mehmetoğlu" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "pysam>=0.23,<0.24",
  "textual>=8.2.8,<9",
]

[project.scripts]
pancontext = "pancontext.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"
